<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Cyber Incident Response Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#070b12;--card:#0e1623;--bd:#1d2b40;--tx:#d6e2f2;--mu:#7f93ad;--ac:#22d3ee;--ok:#34d399;--wa:#fbbf24;--bad:#f43f5e;--pk:#e879f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif;display:flex;min-height:100vh}
nav{width:215px;background:#0a111c;border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;flex:none}
nav h1{font:700 13px ui-monospace,Consolas,monospace;color:var(--ac);margin:0 0 14px;letter-spacing:.5px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:9px 10px;border-radius:6px;cursor:pointer;font:inherit;border-left:2px solid transparent}
nav button.on,nav button:hover{background:#12203a;color:var(--tx);border-left-color:var(--ac)}
main{flex:1;padding:18px;min-width:0;max-width:1200px}h2{margin:0 0 4px;font-size:20px}h3{margin:0 0 8px;font-size:14px;color:var(--ac);font-family:ui-monospace,Consolas,monospace}
.sub{color:var(--mu);margin:0 0 14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:2fr 1fr}
.stat b{display:block;font:700 26px ui-monospace,monospace;color:var(--ac)}.stat span{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mu);font-weight:600}
button.b,select,input,textarea{background:#0b1220;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 9px;font:inherit}
button.b{cursor:pointer;background:#12304a;border-color:#1f4a6e}button.b:hover{background:#17405f}button.p{background:#0e7490;border-color:var(--ac)}button.d{background:#4c1527;border-color:#7f1d3d}
input[type=number]{width:70px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}.row label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:3px}
.bd{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid}
.Critical{color:#fb7185;border-color:#9f1239}.High{color:#fb923c;border-color:#9a3412}.Medium{color:var(--wa);border-color:#854d0e}.Low{color:var(--ok);border-color:#065f46}
.mono{font-family:ui-monospace,Consolas,monospace}.pq{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;margin-bottom:6px;background:#0b1220;font-family:ui-monospace,monospace;font-size:13px}
.pq.top{border-left-color:var(--ok);background:#0d2a28}.chip{display:inline-block;background:#12304a;border:1px solid #1f4a6e;border-radius:5px;padding:2px 8px;margin:2px;font:12px ui-monospace,monospace}
.chip.v{background:#064e5a}.chip.c{background:#78350f;border-color:var(--wa)}.log{max-height:220px;overflow:auto;font:12px ui-monospace,monospace;color:var(--mu)}.log div.n{color:var(--tx)}
details{margin-top:6px;color:var(--mu)}summary{cursor:pointer;color:var(--ac)}svg text{font:11px ui-monospace,monospace;fill:var(--tx)}svg{width:100%;background:#080e18;border:1px solid var(--bd);border-radius:8px;display:block}
.ok{color:var(--ok)}.f{background:#080e18;padding:8px 10px;border-radius:6px;font:12px ui-monospace,monospace;color:var(--wa)}
@media(max-width:900px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap}nav h1{width:100%}nav button{width:auto}.g4,.g2,.g3{grid-template-columns:1fr 1fr}}
</style></head><body>
<nav><h1>⛨ CYBER INCIDENT<br>RESPONSE PLANNER</h1><div id="nav"></div></nav><main id="main"></main>
<script>
/* ================= ALGORITHM LAYER (pure, no UI) ================= */
class PQ{constructor(c){this.h=[];this.cmp=c;this.ops=0}
 push(x){const h=this.h;h.push(x);let i=h.length-1;while(i>0){const p=(i-1)>>1;this.ops++;if(this.cmp(h[i],h[p])<0){[h[i],h[p]]=[h[p],h[i]];i=p}else break}}
 pop(){const h=this.h;if(!h.length)return;const top=h[0],l=h.pop();if(h.length){h[0]=l;let i=0;for(;;){const a=2*i+1,b=a+1;let m=i;if(a<h.length){this.ops++;if(this.cmp(h[a],h[m])<0)m=a}if(b<h.length){this.ops++;if(this.cmp(h[b],h[m])<0)m=b}if(m==i)break;[h[i],h[m]]=[h[m],h[i]];i=m}}return top}
 get size(){return this.h.length}}
const out=(g,u)=>g.edges.filter(e=>e.from==u);
const nm=id=>(S.systems.find(s=>s.id==id)||{name:id}).name;
function pathTo(par,s,t){if(!t||(t!=s&&!(t in par)))return null;const p=[t];while(p[0]!=s)p.unshift(par[p[0]]);return p}
function pathCost(g,p){if(!p)return null;let c=0;for(let i=0;i<p.length-1;i++){const e=g.edges.find(e=>e.from==p[i]&&e.to==p[i+1]);c+=e?e.cost:0}return c}
function bfs(g,s,t){if(!s||!t)return{name:'BFS',order:[],steps:[],ops:0,path:null,cost:null};const q=[s],seen=new Set([s]),order=[],par={},steps=[];let ops=1;
 while(q.length){const u=q.shift();ops++;order.push(u);steps.push({cur:u,front:q.map(nm),vis:[...order],edge:null,ops,desc:`Dequeue ${nm(u)} and visit it`});
  for(const e of out(g,u)){ops++;if(!seen.has(e.to)){seen.add(e.to);par[e.to]=u;q.push(e.to);ops++;steps.push({cur:u,front:q.map(nm),vis:[...order],edge:[u,e.to],ops,desc:`Edge ${nm(u)} → ${nm(e.to)}: not seen yet, enqueue`})}}}
 const path=pathTo(par,s,t);return{name:'BFS',order,steps,ops,path,cost:pathCost(g,path)}}
function dfs(g,s,t){if(!s||!t)return{name:'DFS',order:[],steps:[],ops:0,path:null,cost:null};const st=[[s,null]],seen=new Set(),order=[],par={},steps=[];let ops=1;
 while(st.length){const [u,p]=st.pop();ops++;if(seen.has(u))continue;seen.add(u);if(p)par[u]=p;order.push(u);
  steps.push({cur:u,front:st.map(x=>nm(x[0])).reverse(),vis:[...order],edge:p?[p,u]:null,ops,desc:`Pop ${nm(u)} from stack and visit it`});
  const nb=out(g,u).filter(e=>!seen.has(e.to));ops+=out(g,u).length;nb.reverse().forEach(e=>{st.push([e.to,u]);ops++});}
 const path=pathTo(par,s,t);return{name:'DFS',order,steps,ops,path,cost:pathCost(g,path)}}
function dijkstra(g,s,t){if(!s||!t)return{name:'Dijkstra',order:[],steps:[],ops:0,path:null,cost:null};const dist={[s]:0},par={},done=new Set(),order=[],steps=[],q=new PQ((a,b)=>a.d-b.d);q.push({id:s,d:0});let ed=0;
 const lab=()=>[...q.h].sort((a,b)=>a.d-b.d).map(x=>`${nm(x.id)}(${x.d})`);
 while(q.size){const {id:u,d}=q.pop();if(done.has(u))continue;done.add(u);order.push(u);
  steps.push({cur:u,front:lab(),vis:[...order],edge:null,cost:d,ops:q.ops+ed,desc:`Extract-min: ${nm(u)} with distance ${d} (finalised)`});
  if(u==t)break;
  for(const e of out(g,u)){ed++;const nd=d+e.cost;if(!(e.to in dist)||nd<dist[e.to]){dist[e.to]=nd;par[e.to]=u;q.push({id:e.to,d:nd});
   steps.push({cur:u,front:lab(),vis:[...order],edge:[u,e.to],cost:nd,ops:q.ops+ed,desc:`Relax ${nm(u)} → ${nm(e.to)}: ${d} + ${e.cost} = ${nd}, better distance → push`})}}}
 const path=pathTo(par,s,t);return{name:'Dijkstra',order,steps,ops:q.ops+ed,path,cost:t in dist?dist[t]:null}}
const ALG={bfs,dfs,dijkstra};
/* ===== priority scoring + queue ===== */
const SEV={Critical:10,High:8,Medium:5,Low:2};
function depImp(id){if(!S.systems.some(x=>x.id==id))return 0;const r=bfs(S,id).order.slice(1);const tot=S.systems.filter(x=>x.id!=id).reduce((a,x)=>a+SEV[x.crit],0)||1;return Math.min(10,+(r.reduce((a,x)=>a+SEV[sys(x).crit],0)/tot*10).toFixed(1))}
const dlabel=d=>d>=6?'High':d>=3?'Medium':'Low';
function score(i){const w=S.w,d=depImp(i.sys),den=w.sev+w.urg+w.imp+w.spr+w.dep||1;
 return Math.max(0,+((w.sev*SEV[i.sev]+w.urg*i.urg+w.imp*i.imp+w.spr*i.spr+w.dep*d)/den-w.cost*i.cost/10).toFixed(2))}
function prio(){const q=new PQ((a,b)=>b.score-a.score||a.id.localeCompare(b.id)),steps=[],order=[];
 S.incidents.filter(i=>i.status!='Resolved').forEach(i=>{const x={...i,score:score(i),dep:depImp(i.sys)};q.push(x);steps.push({t:'ins',q:[...q.h].sort(q.cmp),order:[],desc:`Insert ${x.id} (score ${x.score}) into the max-heap`})});
 while(q.size){const x=q.pop();order.push(x);steps.push({t:'ext',q:[...q.h].sort(q.cmp),order:[...order],desc:`Extract-max → ${x.id} (score ${x.score}) is handled next`})}
 return{steps,order,ops:q.ops}}
/* ================= DATA LAYER ================= */
const sys=id=>S.systems.find(s=>s.id==id)||{name:id,crit:'Low'};
const DEMO=()=>({systems:[
 {id:'gw',name:'Internet Gateway',type:'Network',crit:'High',status:'Online',x:80,y:90},{id:'web',name:'Web Server',type:'Server',crit:'High',status:'Compromised',x:270,y:90},
 {id:'app',name:'Application Server',type:'Server',crit:'High',status:'Degraded',x:470,y:90},{id:'db',name:'Database Server',type:'Database',crit:'Critical',status:'Degraded',x:670,y:90},
 {id:'idp',name:'Identity Server',type:'Identity',crit:'Critical',status:'Compromised',x:270,y:260},{id:'adm',name:'Admin Workstation',type:'Endpoint',crit:'High',status:'Online',x:470,y:260},
 {id:'bak',name:'Backup Server',type:'Storage',crit:'Medium',status:'Online',x:670,y:260}],
 edges:[['gw','web',2],['web','app',3],['app','db',5],['idp','web',2],['idp','adm',3],['adm','db',6],['db','bak',2]].map(([from,to,cost])=>({from,to,cost})),
 incidents:[
 {id:'INC-001',name:'Web Server Compromise',sys:'web',sev:'High',urg:8,imp:8,spr:7,cost:4,status:'Open',desc:'Web shell found on public web server.'},
 {id:'INC-002',name:'Database Suspicious Activity',sys:'db',sev:'Medium',urg:5,imp:9,spr:4,cost:5,status:'Investigating',desc:'Unusual bulk queries at night.'},
 {id:'INC-003',name:'Identity Server Compromise',sys:'idp',sev:'Critical',urg:9,imp:10,spr:9,cost:3,status:'Open',desc:'Rogue admin account created on identity server.'},
 {id:'INC-004',name:'Application Server Attack',sys:'app',sev:'High',urg:7,imp:7,spr:6,cost:4,status:'Open',desc:'Exploit attempts against app API.'}],
 w:{sev:2,urg:2,imp:3,spr:2,dep:2,cost:1}});
function load(){try{const d=JSON.parse(localStorage.getItem('cirp'));return d&&d.systems?d:null}catch(e){return null}}
function save(){try{localStorage.setItem('cirp',JSON.stringify(S))}catch(e){}}
let S=load()||DEMO(),uid=10;
const ui={avoid:false,view:'dash',sel:null,edit:null,route:{s:'web',t:'db'},algo:'bfs',ex:{res:null,i:0,tm:null},pq:{r:null,i:0,tm:null}};
const $=id=>document.getElementById(id),v=id=>$(id).value;
const opt=(l,s)=>l.map(x=>Array.isArray(x)?`<option value="${x[0]}" ${x[0]==s?'selected':''}>${x[1]}</option>`:`<option ${x==s?'selected':''}>${x}</option>`).join('');
const sysOpts=s=>opt(S.systems.map(x=>[x.id,x.name]),s);
const act=sev=>({Critical:'Isolate system and restrict unauthorized access',High:'Contain affected service and investigate',Medium:'Monitor, investigate and patch',Low:'Log, review and schedule fix'}[sev]);
/* ================= GRAPH VIEW ================= */
function graph(h={}){return '<div id="gw">'+graphInner(h)+'</div>'}
function graphInner(h={}){ui.hl=h;const vis=new Set(h.vis||[]),blocked=new Set(h.blocked||[]),pe=new Set();if(h.path)for(let i=0;i<h.path.length-1;i++)pe.add(h.path[i]+'>'+h.path[i+1]);
 const col={Online:'#34d399',Degraded:'#fbbf24',Compromised:'#f43f5e'};
 let s=`<svg viewBox="0 0 760 340"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b7595"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e879f9"/></marker></defs>`;
 S.edges.forEach(e=>{if(blocked.has(e.from)||blocked.has(e.to))return;const a=sys(e.from),b=sys(e.to);if(!a.x||!b.x)return;const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,x1=a.x+dx/L*28,y1=a.y+dy/L*28,x2=b.x-dx/L*30,y2=b.y-dy/L*30;
  const isP=pe.has(e.from+'>'+e.to),isC=h.edge&&h.edge[0]==e.from&&h.edge[1]==e.to,c=isP?'#e879f9':isC?'#fbbf24':'#3d5573';
  s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${isP||isC?3.5:1.8}" marker-end="url(#${isP?'p':'a'})"/><text x="${(x1+x2)/2+4}" y="${(y1+y2)/2-5}" style="fill:${isP?'#e879f9':'#7f93ad'}">${e.cost}</text>`});
 S.systems.forEach(n=>{if(blocked.has(n.id))return;const inc=S.incidents.some(i=>i.sys==n.id&&i.status!='Resolved'),isC=h.cur==n.id,isV=vis.has(n.id),isP=h.path&&h.path.includes(n.id);
  s+=`<g style="cursor:grab;touch-action:none" onpointerdown="dragStart(event,'${n.id}')" onclick="selNode('${n.id}')">${inc?`<circle cx="${n.x}" cy="${n.y}" r="31" fill="none" stroke="#f43f5e" stroke-dasharray="3 3"/>`:''}<circle cx="${n.x}" cy="${n.y}" r="24" fill="${isC?'#78350f':isV?'#064e5a':'#0e1623'}" stroke="${isP?'#e879f9':ui.sel==n.id?'#22d3ee':col[n.status]}" stroke-width="${isP||ui.sel==n.id?4:2.5}"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle">${n.crit[0]}</text><text x="${n.x}" y="${n.y+46}" text-anchor="middle">${n.name}</text></g>`});
 return s+'</svg><div class="sub" style="margin:6px 0 0;font-size:12px">Ring colour = status (green online · amber degraded · red compromised) · dashed ring = open incident · letter = criticality · cyan fill = visited · amber fill = current · pink = selected route</div>'}
function selNode(id){ui.sel=id;if(ui.view=='graph')render()}
/* ================= PAGES ================= */
function incTable(order){return `<table><tr><th>ID</th><th>Incident</th><th>System</th><th>Severity</th><th>Urg</th><th>Imp</th><th>Spread</th><th>Cost</th><th>Status</th></tr>${S.incidents.map(i=>`<tr><td class="mono">${i.id}</td><td>${i.name}</td><td>${nm(i.sys)}</td><td><span class="bd ${i.sev}">${i.sev}</span></td><td>${i.urg}</td><td>${i.imp}</td><td>${i.spr}</td><td>${i.cost}</td><td>${i.status}</td></tr>`).join('')}</table>`}
function why(x,rank){const w=S.w,den=w.sev+w.urg+w.imp+w.spr+w.dep;return `<details><summary>Why ${rank?`was ${x.id} ranked #${rank}`:x.id}?</summary><div class="mono" style="font-size:12px;margin-top:6px">• Severity: ${x.sev} (${SEV[x.sev]}) × w${w.sev}<br>• Urgency: ${x.urg} × w${w.urg}<br>• Business impact: ${x.imp} × w${w.imp}<br>• Spread potential: ${x.spr} × w${w.spr}<br>• Dependency impact: ${dlabel(x.dep)} (${x.dep}, from BFS over ${bfs(S,x.sys).order.length-1} downstream systems) × w${w.dep}<br>• Containment cost: ${x.cost} × w${w.cost}/10 subtracted<br>= (${(w.sev*SEV[x.sev]+w.urg*x.urg+w.imp*x.imp+w.spr*x.spr+w.dep*x.dep).toFixed(1)} / ${den}) − ${(w.cost*x.cost/10).toFixed(2)} = <b class="ok">${x.score}</b><br>${rank?`Max-heap extracted ${x.id} ${rank==1?'first because it has the highest score':'after all incidents with a higher score'}.`:''}</div></details>`}
const pages={
dash(){const P=prio(),r=ui.route,B=bfs(S,r.s,r.t),D=dfs(S,r.s,r.t),K=dijkstra(S,r.s,r.t),I=S.incidents,aff=new Set(I.filter(i=>i.status!='Resolved').map(i=>i.sys));
 const tc=P.order.reduce((a,x)=>a+x.cost,0);
 return `<h2>Dashboard</h2><p class="sub">Results below are produced by the implemented algorithms running on your current data.</p>
 <div class="g g4"><div class="card stat"><b>${I.length}</b><span>Total incidents</span></div><div class="card stat"><b>${I.filter(i=>i.sev=='Critical').length}</b><span>Critical</span></div><div class="card stat"><b>${I.filter(i=>i.sev=='High').length}</b><span>High priority</span></div><div class="card stat"><b>${I.filter(i=>i.status=='Resolved').length}</b><span>Resolved · ${aff.size} systems affected</span></div></div>
 <div class="g g2"><div class="card"><h3>FINAL RESPONSE ORDER (Priority Queue)</h3>${P.order.map((x,i)=>`<div class="pq ${i?'':'top'}"><b>${i+1}</b><span>${x.id}</span><span>${x.sev}</span><span>${nm(x.sys)}</span><span style="margin-left:auto">score ${x.score}</span></div>`).join('')||'No open incidents'}<div>Total incident containment cost: <b class="ok">${tc}</b> · Heap operations: ${P.ops}</div></div>
 <div class="card"><h3>ALGORITHM RESULTS · ${nm(r.s)} → ${nm(r.t)}</h3><table><tr><th>Alg</th><th>Visited</th><th>Ops</th><th>Result</th></tr>${[B,D,K].map(a=>`<tr><td>${a.name}</td><td>${a.order.length}</td><td>${a.ops}</td><td style="font-size:12px">${a.path?a.path.map(nm).join(' → ')+' (cost '+a.cost+')':'no route'}</td></tr>`).join('')}</table><p class="sub" style="margin:8px 0 0">BFS order: ${B.order.map(nm).join(', ')}<br>DFS order: ${D.order.map(nm).join(', ')}<br>Lowest-cost route: <b class="ok">${K.path?K.cost:'n/a'}</b></p></div></div>
 <div class="card"><h3>FINAL RECOMMENDED SEQUENCE</h3>${P.order.map((x,i)=>`${i+1}. <b>${x.id}</b> ${nm(x.sys)}${i<P.order.length-1?' → ':''}`).join('')}<p class="sub" style="margin:6px 0 0">Generated by the Priority Queue algorithm from user input — not a prediction.</p></div>`},
inc(){const e=S.incidents.find(i=>i.id==ui.edit)||{id:'',name:'',sys:S.systems[0]?.id,sev:'High',urg:5,imp:5,spr:5,cost:3,status:'Open',desc:''};
 return `<h2>Incident Management</h2><p class="sub">Add, edit and delete incidents; every algorithm re-runs on this data.</p><div class="card"><h3>${ui.edit?'EDIT '+e.id:'ADD INCIDENT'}</h3><div class="row">
 <label>ID<input id="fid" value="${e.id}" ${ui.edit?'disabled':''} placeholder="auto"></label><label>Name<input id="fnm" value="${e.name}"></label><label>Affected system<select id="fsy">${sysOpts(e.sys)}</select></label>
 <label>Severity<select id="fsv">${opt(['Critical','High','Medium','Low'],e.sev)}</select></label><label>Urgency 1-10<input type="number" id="fur" min="1" max="10" value="${e.urg}"></label><label>Impact 1-10<input type="number" id="fim" min="1" max="10" value="${e.imp}"></label>
 <label>Spread 1-10<input type="number" id="fsp" min="1" max="10" value="${e.spr}"></label><label>Contain cost 1-10<input type="number" id="fco" min="1" max="10" value="${e.cost}"></label><label>Status<select id="fst">${opt(['Open','Investigating','Resolved'],e.status)}</select></label></div>
 <div class="row"><label style="flex:1">Description<input id="fde" value="${e.desc}"></label><button class="b p" onclick="saveInc()">${ui.edit?'Save changes':'Add Incident'}</button>${ui.edit?'<button class="b" onclick="ui.edit=null;render()">Cancel</button>':''}</div></div>
 <div class="card"><div class="row"><button class="b p" onclick="go('pq');runPQ()">Run Prioritization</button><button class="b d" onclick="if(confirm('Reset to demo data?')){S=DEMO();ui.edit=ui.sel=null;ui.ex.res=null;render()}">Reset Data</button></div>
 <table><tr><th>ID</th><th>Incident</th><th>System</th><th>Severity</th><th>Score</th><th>Status</th><th></th></tr>${S.incidents.map(i=>`<tr><td class="mono">${i.id}</td><td>${i.name}<div class="sub" style="margin:0;font-size:11px">${i.desc}</div></td><td>${nm(i.sys)}</td><td><span class="bd ${i.sev}">${i.sev}</span></td><td class="mono">${score(i)}</td><td>${i.status}</td><td><button class="b" onclick="ui.edit='${i.id}';render()">Edit</button> <button class="b d" onclick="delInc('${i.id}')">Delete</button></td></tr>`).join('')}</table></div>`},
graph(){const n=sys(ui.sel),has=S.systems.find(x=>x.id==ui.sel),r=ui.route;
 return `<h2>Dependency Graph</h2><p class="sub">Edge A → B with cost c: B depends on / is reachable from A. Click a node to inspect it, drag it to reposition. Cost is the effort to move containment across that link.</p><div class="g g3"><div>${graph(ui.last||{})}</div><div class="card">${has?`<h3>NODE: ${n.name}</h3>Type: ${n.type}<br>Criticality: <span class="bd ${n.crit}">${n.crit}</span><br>Status: ${n.status}<br>Open incidents: ${S.incidents.filter(i=>i.sys==n.id&&i.status!='Resolved').map(i=>i.id).join(', ')||'none'}<br>Connected systems: ${S.edges.filter(e=>e.from==n.id||e.to==n.id).length}<br>Dependency impact: <b>${dlabel(depImp(n.id))}</b> (${depImp(n.id)}/10)<br>Depends on: ${S.edges.filter(e=>e.to==n.id).map(e=>nm(e.from)).join(', ')||'—'}<br>Affects: ${S.edges.filter(e=>e.from==n.id).map(e=>nm(e.to)).join(', ')||'—'}<br>Downstream (BFS): ${bfs(S,n.id).order.slice(1).map(nm).join(', ')||'—'}
 <div class="row" style="margin-top:8px"><label>Criticality<select onchange="sys('${n.id}').crit=this.value;render()">${opt(['Critical','High','Medium','Low'],n.crit)}</select></label><label>Status<select onchange="sys('${n.id}').status=this.value;render()">${opt(['Online','Degraded','Compromised'],n.status)}</select></label></div><button class="b d" onclick="delSys('${n.id}')">Remove system</button>`:'<h3>NODE INSPECTOR</h3>Select a node.'}</div></div>
 <div class="g g2"><div class="card"><h3>ADD SYSTEM</h3><div class="row"><label>Name<input id="sn"></label><label>Type<input id="st" value="Server" style="width:90px"></label><label>Criticality<select id="sc">${opt(['Critical','High','Medium','Low'],'High')}</select></label><button class="b p" onclick="addSys()">Add</button></div></div>
 <div class="card"><h3>ADD DEPENDENCY</h3><div class="row"><label>From<select id="ef">${sysOpts()}</select></label><label>To<select id="et">${sysOpts()}</select></label><label>Cost<input type="number" id="ec" value="3" min="1"></label><button class="b p" onclick="addEdge()">Add</button></div></div></div>
 <div class="card"><h3>DEPENDENCIES</h3>${S.edges.map((e,i)=>`<span class="chip">${nm(e.from)} → ${nm(e.to)} · cost <input type="number" value="${e.cost}" min="1" style="width:50px;padding:1px 4px" onchange="S.edges[${i}].cost=Math.max(1,+this.value);render()"> <a href="#" style="color:#fb7185" onclick="S.edges.splice(${i},1);render();return false">✕</a></span>`).join('')}</div>`},
pq(){const w=S.w,r=ui.pq.r||prio(),i=ui.pq.r?ui.pq.i:r.steps.length,st=r.steps[i-1],q=st?st.q:[];
 return `<h2>Priority Queue</h2><p class="sub">A binary max-heap picks the next incident. Insert and extract are O(log n); n inserts + n extracts give O(n log n).</p>
 <div class="card"><h3>SCORING FORMULA (editable weights)</h3><div class="f">Score = (Ws·Severity + Wu·Urgency + Wi·Impact + Wp·Spread + Wd·DependencyImpact) / ΣW − Wc·Cost/10</div><div class="row" style="margin-top:8px">${[['sev','Ws Severity'],['urg','Wu Urgency'],['imp','Wi Impact'],['spr','Wp Spread'],['dep','Wd Dependency'],['cost','Wc Cost penalty']].map(([k,l])=>`<label>${l}<input type="number" step="0.5" min="0" value="${w[k]}" onchange="S.w.${k}=Math.max(0,+this.value);ui.pq.r=null;render()"></label>`).join('')}</div>Severity: Critical=10, High=8, Medium=5, Low=2. Dependency impact = weighted share of downstream systems found by BFS (0-10).</div>
 <div class="row"><button class="b p" onclick="runPQ()">Run Incident Prioritization</button><button class="b" onclick="stepPQ()">Next Step</button><button class="b" onclick="resetPQ()">Reset</button></div>
 <div class="g g2"><div class="card"><h3>PRIORITY QUEUE ${st?'· step '+i+'/'+r.steps.length:''}</h3>${st?`<p class="ok mono">${st.desc}</p>`:'<p class="sub">Press Run to watch the queue being built and emptied.</p>'}${q.map((x,k)=>`<div class="pq ${k?'':'top'}"><span>[ ${x.id}</span>|<span>${x.sev}</span>|<span>Score ${x.score} ]</span></div>`).join('')||(st?'<i>queue empty</i>':'')}</div>
 <div class="card"><h3>SELECTION ORDER</h3>${(st?st.order:r.order).map((x,k)=>`<div class="pq top"><b>Step ${k+1} → Select ${x.id}</b><span style="margin-left:auto">${nm(x.sys)}</span></div>`).join('')||'<span class="sub">nothing selected yet</span>'}<p style="margin:8px 0 0">Heap operations: ${r.ops}</p></div></div>
 <div class="card"><h3>SCORES & EXPLANATION</h3>${r.order.map((x,k)=>`<div><b>${x.id}</b> ${x.name} — Severity ${x.sev}, Urgency ${x.urg}, Impact ${x.imp}, Spread ${x.spr}, Cost ${x.cost}, <b class="ok">Score ${x.score}</b>${why(x,k+1)}</div>`).join('')}</div>`},
exec(){const r=ui.route,e=ui.ex,res=e.res,n=res?res.steps.length:0,st=res&&e.i>0?res.steps[Math.min(e.i,n)-1]:null,fin=res&&e.i>=n;
 return `<h2>Algorithm Execution & Containment Route</h2><p class="sub">Pick an algorithm, source and target, then step through every decision.</p><div class="card"><div class="row"><label>Algorithm<select onchange="ui.algo=this.value;resetEx()">${opt([['bfs','BFS'],['dfs','DFS'],['dijkstra','Dijkstra (lowest cost)']],ui.algo)}</select></label><label>Source<select onchange="ui.route.s=this.value;resetEx()">${sysOpts(r.s)}</select></label><label>Target<select onchange="ui.route.t=this.value;resetEx()">${sysOpts(r.t)}</select></label>
 <button class="b p" onclick="startEx()">Start</button><button class="b" onclick="pauseEx()">Pause</button><button class="b" onclick="stepEx()">Next Step</button><button class="b" onclick="resetEx()">Reset</button></div></div>
 <div class="g g3"><div>${graph({cur:st?.cur,vis:st?.vis,edge:st?.edge,path:fin?res.path:null})}</div><div class="card"><h3>STATE ${st?'· step '+Math.min(e.i,n)+'/'+n:''}</h3>${st?`<p class="mono ok">${st.desc}</p>Current node: <span class="chip c">${nm(st.cur)}</span><br>${ui.algo=='bfs'?'Queue':ui.algo=='dfs'?'Stack (top first)':'Priority queue'}: ${st.front.map(x=>`<span class="chip">${x}</span>`).join('')||'<i>empty</i>'}<br>Visited: ${st.vis.map(x=>`<span class="chip v">${nm(x)}</span>`).join('')}<br>Selected edge: ${st.edge?nm(st.edge[0])+' → '+nm(st.edge[1]):'—'}<br>Current cost: ${st.cost??'—'}<br>Operations: ${st.ops}`:'Press Start or Next Step.'}
 ${fin?`<hr style="border-color:var(--bd)"><h3>FINAL RESULT</h3>Algorithm: ${res.name}<br>Source: ${nm(r.s)}<br>Target: ${nm(r.t)}<br>Route: <b class="ok">${res.path?res.path.map(nm).join(' → '):'No route exists'}</b><br>Total cost: <b class="ok">${res.path?res.cost:'—'}</b><br>Nodes visited: ${res.order.length} · Operations: ${res.ops}<details open><summary>Why this route?</summary>${ui.algo=='dijkstra'?'Dijkstra always finalises the unvisited node with the smallest known distance, so the first time the target is finalised its distance is the minimum.':ui.algo=='bfs'?'BFS explores level by level, so it finds the route with the fewest links, not necessarily the lowest cost.':'DFS follows one branch as deep as possible first, so its route depends on edge order and may be long or costly.'}</details>`:''}</div></div>
 <div class="card"><h3>STEP LOG</h3><div class="log">${res?res.steps.slice(0,Math.min(e.i,n)).map((s,k)=>`<div class="${k==e.i-1?'n':''}">${k+1}. ${s.desc}</div>`).join(''):''}</div></div>`},
cmp(){const r=ui.route,R=[bfs(S,r.s,r.t),dfs(S,r.s,r.t),dijkstra(S,r.s,r.t)],cx={BFS:'O(V + E)',DFS:'O(V + E)',Dijkstra:'O((V + E) log V)'},pu={BFS:'Dependency traversal (fewest hops)',DFS:'Dependency traversal (deep first)',Dijkstra:'Lowest-cost route'};
 return `<h2>Algorithm Comparison</h2><p class="sub">All three algorithms just ran on your graph: ${nm(r.s)} → ${nm(r.t)} (V=${S.systems.length}, E=${S.edges.length}).</p><div class="row card"><label>Source<select onchange="ui.route.s=this.value;render()">${sysOpts(r.s)}</select></label><label>Target<select onchange="ui.route.t=this.value;render()">${sysOpts(r.t)}</select></label></div>
 <div class="card"><table><tr><th>Algorithm</th><th>Purpose</th><th>Steps</th><th>Nodes visited</th><th>Operations</th><th>Complexity</th><th>Path to target</th><th>Cost</th></tr>${R.map(a=>`<tr><td><b>${a.name}</b></td><td>${pu[a.name]}</td><td>${a.steps.length}</td><td>${a.order.length}</td><td>${a.ops}</td><td class="mono">${cx[a.name]}</td><td style="font-size:12px">${a.path?a.path.map(nm).join(' → '):'none'}</td><td>${a.cost??'—'}</td></tr>`).join('')}</table></div>
 <div class="g g2"><div class="card"><h3>VISIT ORDER</h3>${R.map(a=>`<p><b>${a.name}</b><br>${a.order.map((x,i)=>`<span class="chip v">${i+1}. ${nm(x)}</span>`).join('')}</p>`).join('')}</div>
 <div class="card"><h3>WHAT THE NUMBERS SHOW</h3><p>BFS uses a queue (FIFO) and spreads outward in layers; DFS uses a stack (LIFO) and dives down one branch first. Both are O(V+E) because each node and edge is handled once. Dijkstra adds a min-heap, so each push/pop costs O(log V) giving O((V+E) log V), but it is the only one that guarantees the minimum total cost.</p>${R[0].cost!=null&&R[2].cost!=null?`<p class="ok">BFS route cost ${R[0].cost}, DFS route cost ${R[1].cost}, Dijkstra ${R[2].cost}.${R[2].cost<R[0].cost||R[2].cost<R[1].cost?' Dijkstra found a cheaper route than a traversal-based one.':' Here all routes happen to cost the same.'}</p>`:''}</div></div>`},
route(){const r=ui.route;if(!S.systems.length)return `<h2>Containment Route</h2><div class="card"><b>No systems are available.</b><p class="sub">Add at least two systems before calculating a containment route.</p></div>`;
 fixRoute();const bad=id=>ui.avoid&&sys(id).status=='Compromised'&&id!=r.s&&id!=r.t,blocked=S.systems.filter(x=>bad(x.id)).map(x=>x.id),g={edges:S.edges.filter(e=>!bad(e.from)&&!bad(e.to))},K=dijkstra(g,r.s,r.t),B=bfs(g,r.s,r.t),p=K.path;
 return `<h2>Containment Route</h2><p class="sub">Choose a source and target; Dijkstra finds the lowest-cost route through the dependency graph.</p>
 <div class="card"><div class="row"><label>Source<select onchange="setRouteSource(this.value)">${sysOpts(r.s)}</select></label><label>Target<select onchange="setRouteTarget(this.value)">${sysOpts(r.t)}</select></label><label style="flex-direction:row;align-items:center;gap:6px;color:var(--tx);font-size:13px"><input type="checkbox" ${ui.avoid?'checked':''} onchange="ui.avoid=this.checked;render()">Avoid compromised systems on the route</label><button class="b" onclick="swapRoute()">Swap</button><button class="b" onclick="resetRoute()">Reset</button><button class="b p" onclick="stepRoute()">Step through algorithm →</button></div></div>
 <div class="g g3"><div>${graph({path:p,vis:K.order,blocked})}</div><div class="card"><h3>RESULT</h3>Selected Algorithm: <b>Dijkstra</b><br>Source: ${nm(r.s)}<br>Target: ${nm(r.t)}<br><br>Containment Route:<div class="f" style="text-align:center;margin:6px 0">${p?p.map(nm).join('<br>↓<br>'):'No route exists'}</div>Total Cost: <b class="ok">${p?K.cost:'—'}</b><br>Nodes processed: ${K.order.length} · Operations: ${K.ops}
 ${p?`<table style="margin-top:8px"><tr><th>Hop</th><th>Cost</th></tr>${p.slice(1).map((x,i)=>{const e=g.edges.find(e=>e.from==p[i]&&e.to==x);return `<tr><td>${nm(p[i])} → ${nm(x)}</td><td>${e?e.cost:'—'}</td></tr>`}).join('')}</table>`:''}
 <details open><summary>Why this route?</summary>Dijkstra finalised nodes in order of lowest known distance: ${K.order.map(nm).join(', ')||'none'}. The first time the target is finalised its distance is the minimum possible.${B.path?` For comparison, BFS (fewest hops) gives ${B.path.map(nm).join(' → ')} at cost ${B.cost}.`:''}${ui.avoid?' Compromised intermediate systems were excluded.':''}</details></div></div>`},
plan(){const P=prio(),K=dijkstra(S,ui.route.s,ui.route.t);
 return `<h2>Response Plan</h2><p class="sub">Generated from the Priority Queue order, BFS impact analysis and the user's input data.</p><div class="card">${P.order.map((x,i)=>{const d=bfs(S,x.sys).order.slice(1);return `<div class="pq ${i?'':'top'}" style="display:block"><b>${i+1}. ${x.id} — ${nm(x.sys)}</b> <span class="bd ${x.sev}">${x.sev}</span><br>Priority: ${x.score} · Dependency impact: ${dlabel(x.dep)} · Containment cost: ${x.cost}<br>Action: ${act(x.sev)}<br>Systems at risk (BFS): ${d.map(nm).join(', ')||'none'}${why(x,i+1)}</div>`}).join('')||'No open incidents.'}</div>
 <div class="card"><h3>OBJECTIVE</h3>Total containment cost of plan: <b class="ok">${P.order.reduce((a,x)=>a+x.cost,0)}</b><br>Containment route ${nm(ui.route.s)} → ${nm(ui.route.t)} (Dijkstra): ${K.path?K.path.map(nm).join(' → ')+' · cost '+K.cost:'no route'}<p class="sub">Incidents are handled in descending score; ties broken by ID.</p></div>`}};
/* ================= CONTROLS ================= */
const NAV=[['dash','Dashboard'],['inc','Incidents'],['graph','Dependency Graph'],['pq','Priority Queue'],['exec','Algorithm Execution'],['route','Containment Route'],['cmp','Algorithm Comparison'],['plan','Response Plan']];
function render(){save();$('nav').innerHTML=NAV.map(([k,l])=>`<button class="${ui.view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('main').innerHTML=pages[ui.view]()}
function go(k){clearInterval(ui.ex.tm);clearInterval(ui.pq.tm);ui.view=k;render()}
function saveInc(){const g=i=>Math.min(10,Math.max(1,+v(i)||1));let id=ui.edit||v('fid').trim()||'INC-'+String(S.incidents.length+1).padStart(3,'0');
 if(!ui.edit&&S.incidents.some(i=>i.id==id))return alert('ID already exists');if(!v('fnm').trim())return alert('Name required');
 const o={id,name:v('fnm'),sys:v('fsy'),sev:v('fsv'),urg:g('fur'),imp:g('fim'),spr:g('fsp'),cost:g('fco'),status:v('fst'),desc:v('fde')};
 if(ui.edit)S.incidents[S.incidents.findIndex(i=>i.id==id)]=o;else S.incidents.push(o);ui.edit=null;render()}
function delInc(id){S.incidents=S.incidents.filter(i=>i.id!=id);render()}
function addSys(){const n=v('sn').trim();if(!n)return;const k=S.systems.length;S.systems.push({id:'s'+Date.now(),name:n,type:v('st'),crit:v('sc'),status:'Online',x:80+(k%4)*200,y:170+Math.floor(k/4)*60});render()}
function delSys(id){S.systems=S.systems.filter(s=>s.id!=id);S.edges=S.edges.filter(e=>e.from!=id&&e.to!=id);S.incidents=S.incidents.filter(i=>i.sys!=id);ui.sel=null;ui.ex.res=null;fixRoute();render()}
function fixRoute(){const ids=S.systems.map(s=>s.id);if(!ids.length){ui.route.s=null;ui.route.t=null;return}if(!ids.includes(ui.route.s))ui.route.s=ids[0];if(!ids.includes(ui.route.t))ui.route.t=ids[Math.max(0,ids.length-1)];if(ids.length>1&&ui.route.s==ui.route.t)ui.route.t=ids.find(id=>id!=ui.route.s)||ui.route.s}
function setRouteSource(id){if(!S.systems.some(s=>s.id==id))return;ui.route.s=id;if(ui.route.s==ui.route.t&&S.systems.length>1)ui.route.t=S.systems.find(s=>s.id!=id).id;ui.ex.res=null;ui.ex.i=0;render()}
function setRouteTarget(id){if(!S.systems.some(s=>s.id==id))return;ui.route.t=id;if(ui.route.s==ui.route.t&&S.systems.length>1)ui.route.s=S.systems.find(s=>s.id!=id).id;ui.ex.res=null;ui.ex.i=0;render()}
function swapRoute(){if(!ui.route.s||!ui.route.t)return;[ui.route.s,ui.route.t]=[ui.route.t,ui.route.s];ui.ex.res=null;ui.ex.i=0;render()}
function resetRoute(){fixRoute();ui.avoid=false;ui.ex.res=null;ui.ex.i=0;render()}
function stepRoute(){go('exec');ui.algo='dijkstra';resetEx()}
function addEdge(){const f=v('ef'),t=v('et');if(f==t)return alert('Pick two different systems');if(S.edges.some(e=>e.from==f&&e.to==t))return alert('Dependency exists');S.edges.push({from:f,to:t,cost:Math.max(1,+v('ec')||1)});render()}
function runPQ(){clearInterval(ui.pq.tm);ui.pq.r=prio();ui.pq.i=0;render();ui.pq.tm=setInterval(()=>{if(ui.pq.i>=ui.pq.r.steps.length)return clearInterval(ui.pq.tm);ui.pq.i++;if(ui.view=='pq')render()},900)}
function stepPQ(){clearInterval(ui.pq.tm);if(!ui.pq.r){ui.pq.r=prio();ui.pq.i=0}if(ui.pq.i<ui.pq.r.steps.length)ui.pq.i++;render()}
function resetPQ(){clearInterval(ui.pq.tm);ui.pq.r=null;render()}
function mkEx(){fixRoute();if(!ui.route.s||!ui.route.t){ui.ex.res={name:ui.algo,order:[],steps:[],ops:0,path:null,cost:null};ui.ex.i=0;return}if(!ui.ex.res){ui.ex.res=ALG[ui.algo](S,ui.route.s,ui.route.t);ui.ex.i=0}}
function stepEx(){pauseEx();mkEx();if(ui.ex.i<ui.ex.res.steps.length)ui.ex.i++;ui.last=ui.ex.i>=ui.ex.res.steps.length?{path:ui.ex.res.path,vis:ui.ex.res.order}:null;render()}
function startEx(){clearInterval(ui.ex.tm);mkEx();if(ui.ex.i>=ui.ex.res.steps.length)ui.ex.i=0;ui.ex.tm=setInterval(()=>{if(ui.ex.i>=ui.ex.res.steps.length){clearInterval(ui.ex.tm);ui.last={path:ui.ex.res.path,vis:ui.ex.res.order};return}ui.ex.i++;render()},800)}
function pauseEx(){clearInterval(ui.ex.tm)}
function resetEx(){pauseEx();ui.ex.res=null;ui.ex.i=0;ui.last=null;render()}
function dragStart(ev,id){ev.preventDefault();const n=sys(id);
 const mv=e=>{const sv=$('gw').querySelector('svg'),pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(sv.getScreenCTM().inverse());n.x=Math.round(Math.max(30,Math.min(730,q.x)));n.y=Math.round(Math.max(30,Math.min(300,q.y)));$('gw').innerHTML=graphInner(ui.hl)};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);save()};addEventListener('pointermove',mv);addEventListener('pointerup',up)}
fixRoute();render();
</script></body></html>
